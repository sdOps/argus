global:
  scrape_interval: 15s

scrape_configs:
  - job_name: argus-demo-stack
    static_configs:
      - targets:
          - host.docker.internal:8081
          - host.docker.internal:8082
          - host.docker.internal:8083
          - host.docker.internal:8084
          - host.docker.internal:8085
          - host.docker.internal:8086
    relabel_configs:
      - source_labels: [__address__]
        regex: ".*:8081"
        target_label: service
        replacement: gateway
      - source_labels: [__address__]
        regex: ".*:8082"
        target_label: service
        replacement: app-ui
      - source_labels: [__address__]
        regex: ".*:8083"
        target_label: service
        replacement: app-api
      - source_labels: [__address__]
        regex: ".*:8084"
        target_label: service
        replacement: auth
      - source_labels: [__address__]
        regex: ".*:8085"
        target_label: service
        replacement: pgsql
      - source_labels: [__address__]
        regex: ".*:8086"
        target_label: service
        replacement: redis

  # Argus self-observability: the agent is a monitored service in its own stack.
  - job_name: argus-server
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          service: argus-server