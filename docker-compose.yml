# Argus — full reference stack in one command:
#
#   docker compose up --build
#
# Brings up the 6 demo microservices, argus-server (headless Pi agent, which also serves
# the built UI single-origin on :3000), and the VictoriaMetrics + vmalert + Alertmanager
# observability stack, plus a mock Slack sink — all on one compose network using service-DNS
# names. The UI is at http://localhost:3000 (no separate UI container under Docker).
#
# This is the Alertmanager ingestion mode (the server's built-in scraper is disabled
# with DISABLE_SCRAPER=1); it mirrors `mise run infra:start` but runs *everything* in
# Docker instead of natively. The native `mise run dev` loop is unaffected.
#
# ── Ollama is the one cross-boundary link ──────────────────────────────────────────
# Ollama is NOT in this compose file — it's host/GPU-bound (and may point at a cloud
# model). The agent reaches it on your host via host.docker.internal:11434, set through
# OLLAMA_BASE_URL on the argus-server service below. Make sure Ollama is running on the
# host before triage can execute end-to-end. To use a different endpoint/model, override
# OLLAMA_BASE_URL / OLLAMA_MODEL (and the model id in .pi/agent/settings.json).
# ───────────────────────────────────────────────────────────────────────────────────

name: argus

services:
  # ── Demo microservices (one image, command per service) ──
  gateway:
    build: ./demo-services
    image: argus-demo-services
    command: ["bun", "demo-services/gateway.ts"]
    ports: ["8081:8081"]
    restart: unless-stopped

  app-ui:
    build: ./demo-services
    image: argus-demo-services
    command: ["bun", "demo-services/app-ui.ts"]
    ports: ["8082:8082"]
    restart: unless-stopped

  app-api:
    build: ./demo-services
    image: argus-demo-services
    command: ["bun", "demo-services/app-api.ts"]
    ports: ["8083:8083"]
    restart: unless-stopped

  auth:
    build: ./demo-services
    image: argus-demo-services
    command: ["bun", "demo-services/auth.ts"]
    ports: ["8084:8084"]
    restart: unless-stopped

  pgsql:
    build: ./demo-services
    image: argus-demo-services
    command: ["bun", "demo-services/pgsql.ts"]
    ports: ["8085:8085"]
    restart: unless-stopped

  redis:
    build: ./demo-services
    image: argus-demo-services
    command: ["bun", "demo-services/redis.ts"]
    ports: ["8086:8086"]
    restart: unless-stopped

  # ── Mock Slack sink (logs what Argus would post) ──
  mock-slack:
    image: oven/bun:1.3.6
    working_dir: /app
    volumes:
      - ./infra/scripts:/app/scripts:ro
    command: ["bun", "scripts/mock-slack.js"]
    ports: ["8090:8090"]
    restart: unless-stopped

  # ── Observability stack ──
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: argus-vm
    ports: ["8428:8428"]
    volumes:
      - vmdata:/victoria-metrics-data
      - ./infra/config/scrape.compose.yml:/etc/vm/scrape.yml:ro
    command:
      - "-promscrape.config=/etc/vm/scrape.yml"
      - "-httpListenAddr=:8428"
    depends_on:
      - gateway
      - app-ui
      - app-api
      - auth
      - pgsql
      - redis
      - argus-server
    restart: unless-stopped

  vmalert:
    image: victoriametrics/vmalert:latest
    container_name: argus-vmalert
    ports: ["8880:8880"]
    depends_on:
      - victoriametrics
      - alertmanager
    volumes:
      - ./infra/config/rules:/etc/vmalert/rules:ro
    command:
      - "-rule=/etc/vmalert/rules/services.yml"
      - "-datasource.url=http://victoriametrics:8428"
      - "-notifier.url=http://alertmanager:9093"
      - "-remoteWrite.url=http://victoriametrics:8428"
      - "-remoteRead.url=http://victoriametrics:8428"
      - "-httpListenAddr=:8880"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: argus-alertmanager
    ports: ["9093:9093"]
    volumes:
      - ./infra/config/alertmanager.compose.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  # ── Argus server (headless agent) ──
  argus-server:
    build:
      context: .
      dockerfile: argus-server/Dockerfile
    image: argus-server
    ports: ["3000:3000"]
    environment:
      # Alertmanager provides alerts in this mode — disable the built-in scraper.
      DISABLE_SCRAPER: "1"
      # Reach demo services by compose DNS name (http://gateway:8081, …) not localhost.
      SERVICE_DNS: "1"
      VM_URL: "http://victoriametrics:8428"
      VMALERT_URL: "http://vmalert:8880"
      MOCK_SLACK_URL: "http://mock-slack:8090"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      # How long to wait for an operator to explain an external/auto resolution before
      # Argus writes a research-only RCA (human-in-the-loop gate on the RCA).
      RCA_OPERATOR_TIMEOUT_SEC: "${RCA_OPERATOR_TIMEOUT_SEC:-180}"
      # The one cross-boundary link: Ollama runs on the host, not in compose.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-}"
      DB_PATH: "/data/argus.db"
    extra_hosts:
      # Lets the container resolve the host (needed for host.docker.internal on Linux;
      # harmless on macOS/Windows where Docker Desktop provides it already).
      - "host.docker.internal:host-gateway"
    volumes:
      - argusdata:/data
    depends_on:
      - gateway
      - app-ui
      - app-api
      - auth
      - pgsql
      - redis
      - mock-slack
    restart: unless-stopped
    # Note: argus-server also serves the built UI single-origin at http://localhost:3000
    # (app + /api + /ws on one port). There is no separate UI container under Docker — that
    # keeps the live-chat WebSocket off a proxy so it connects instantly. Native `mise run dev`
    # still runs the UI as a Vite dev server on :5173.

volumes:
  vmdata:
  argusdata:
