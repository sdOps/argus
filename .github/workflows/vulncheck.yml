name: Vulnerabilities

# Its own workflow because it is the one check whose result can change without the
# repository changing: a newly published advisory against an unchanged dependency only
# surfaces on a scheduled run. bun.lock isn't parsed by GitHub's dependency graph, so
# Dependabot alerts don't cover this repo — bun audit is what actually catches it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, off the hour to avoid the top-of-hour scheduling crowd.
    - cron: "17 4 * * 1"
  # So an advisory can be checked without waiting for the next scheduled run.
  workflow_dispatch:

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      # Each has its own bun.lock (root, server, UI aren't one bun workspace), so each
      # gets its own audit. Reads the lockfile directly — no install needed.
      - name: Audit — root
        run: bun audit

      - name: Audit — server
        run: bun audit --cwd argus-server

      - name: Audit — UI
        run: bun audit --cwd argus-ui
